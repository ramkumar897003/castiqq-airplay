name: Castiqq AirPlay test build

# A debug-signed APK of Castiqq AirPlay to install over adb for testing,
# on every push to main. Store builds still come from apk.yml with the
# release key.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Castiqq-AirPlay-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
